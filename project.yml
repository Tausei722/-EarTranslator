name: EarTranslator
options:
  bundleIdPrefix: com.earapp
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"

targets:
  EarTranslator:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - EarTranslator
    info:
      path: EarTranslator/Info.plist
      properties:
        CFBundleDisplayName: EarTranslator
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        NSMicrophoneUsageDescription: 翻訳のためにマイクを使用します
        NSSpeechRecognitionUsageDescription: 音声をテキストに変換して翻訳します
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.earapp.EarTranslator
        DEVELOPMENT_TEAM: ""
